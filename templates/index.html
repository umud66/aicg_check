<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICG Check v0.2</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><main class="shell">
<header class="hero"><div><p class="eyebrow">AICG CHECK · v0.2</p><h1>论文 AIGC 风险分析</h1><p class="lead">段落规则 + 全文风格基线 + 文风突变 + 跨段近似重复 + 章节画像。</p></div><div class="status-badge">服务器处理 · 不调用收费 AIGC API</div></header>
<section class="notice"><strong>说明：</strong>这是可解释风险估算，不是“AI 写作鉴定”。DOCX 解析最稳定；扫描 PDF 请先 OCR。</section>
<section class="panel"><form id="uploadForm"><label class="dropzone" id="dropzone" for="fileInput"><input id="fileInput" type="file" accept=".docx,.pdf" hidden><span class="drop-title">拖入论文，或点击选择文件</span><span class="drop-sub">DOCX / PDF · 最大 {{ max_upload_mb }} MB</span><span class="file-name" id="fileName">尚未选择文件</span></label><div class="settings"><label>分析配置<select id="profile"><option value="general">通用硕士论文</option><option value="public_management" selected>公共管理 / 政策类论文</option><option value="strict">严格模式</option></select></label><label>中风险阈值 <b id="mediumValue">40</b><input id="mediumThreshold" type="range" min="25" max="60" value="40"></label><label>高风险阈值 <b id="highValue">65</b><input id="highThreshold" type="range" min="50" max="85" value="65"></label><button id="analyzeBtn" class="primary">开始分析</button></div></form><p id="errorBox" class="error" hidden></p></section>
<section id="loading" class="panel loading" hidden><span class="spinner"></span><div><strong>正在进行全文级分析</strong><p>将同时计算段落特征、跨段相似、章节画像和文风突变。</p></div></section>
<section id="results" hidden><div class="result-head"><div><p class="eyebrow">ANALYSIS RESULT</p><h2 id="resultFilename"></h2><p id="profileName"></p></div><div class="actions"><button id="downloadCsv" class="ghost">导出 CSV</button></div></div>
<div class="cards"><article class="metric"><span>有效正文字符</span><strong id="totalChars">-</strong></article><article class="metric"><span>综合风险指数</span><strong id="weightedScore">-</strong></article><article class="metric"><span>AIGC 风险估算占比</span><strong id="estimatedRatio">-</strong></article><article class="metric"><span>高风险文本占比</span><strong id="highRatio">-</strong></article></div>
<section class="panel"><div class="section-title"><h3>全文级信号</h3><span>用于辅助解释，不单独作为结论</span></div><div id="signals"></div></section>
<section class="panel"><div class="section-title"><h3>章节画像</h3></div><div class="table-wrap"><table><thead><tr><th>章节</th><th>字符数</th><th>平均风险</th><th>高风险占比</th><th>词汇多样性</th><th>平均句长</th></tr></thead><tbody id="chapterRows"></tbody></table></div></section>
<section class="panel"><div class="section-title"><h3>段落明细</h3><div class="filters"><select id="levelFilter"><option value="all">全部等级</option><option value="高">高风险</option><option value="中">中风险</option><option value="低">低风险</option></select><input id="searchBox" placeholder="搜索章节或原文"></div></div><div id="paragraphList" class="paragraph-list"></div></section></section>
</main><script>
let analysis=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setFile(f){if(!f)return;const dt=new DataTransfer();dt.items.add(f);$('fileInput').files=dt.files;$('fileName').textContent=`${f.name} · ${(f.size/1048576).toFixed(2)} MB`}$('fileInput').onchange=e=>setFile(e.target.files[0]);['dragenter','dragover'].forEach(x=>$('dropzone').addEventListener(x,e=>{e.preventDefault();$('dropzone').classList.add('dragging')}));['dragleave','drop'].forEach(x=>$('dropzone').addEventListener(x,e=>{e.preventDefault();$('dropzone').classList.remove('dragging')}));$('dropzone').ondrop=e=>setFile(e.dataTransfer.files[0]);$('mediumThreshold').oninput=e=>$('mediumValue').textContent=e.target.value;$('highThreshold').oninput=e=>$('highValue').textContent=e.target.value;
$('uploadForm').onsubmit=async e=>{e.preventDefault();$('errorBox').hidden=true;const f=$('fileInput').files[0];if(!f)return err('请先选择文件');const d=new FormData();d.append('file',f);d.append('profile',$('profile').value);d.append('medium_threshold',$('mediumThreshold').value);d.append('high_threshold',$('highThreshold').value);$('loading').hidden=false;$('results').hidden=true;try{const r=await fetch('/api/analyze',{method:'POST',body:d});const p=await r.json();if(!r.ok)throw new Error(p.error||'分析失败');analysis=p;render()}catch(x){err(x.message)}finally{$('loading').hidden=true}};
function err(m){$('errorBox').textContent=m;$('errorBox').hidden=false}
function render(){const s=analysis.summary,ds=s.document_signals||{};$('resultFilename').textContent=analysis.filename;$('profileName').textContent=`分析配置：${analysis.profile_name}`;$('totalChars').textContent=s.total_chars.toLocaleString();$('weightedScore').textContent=s.weighted_score+' / 100';$('estimatedRatio').textContent=s.estimated_ratio+'%';$('highRatio').textContent=s.high_ratio+'%';$('signals').innerHTML=`<div class="micro">跨段高相似：<b>${ds.cross_duplicate_count||0}</b>　文风突变：<b>${ds.style_shift_count||0}</b>　段落长度CV：<b>${ds.paragraph_length_cv??'-'}</b>　句长均值CV：<b>${ds.sentence_mean_cv??'-'}</b>　平均词汇多样性：<b>${ds.avg_lexical_diversity??'-'}</b></div>${ds.regularity_warning?'<div class="reason">全文段落长度异常规律</div>':''}${ds.sentence_regularity_warning?'<div class="reason">全文平均句长异常规律</div>':''}${(ds.repeated_sentence_starts||[]).length?`<div class="reason">重复句首：${esc(ds.repeated_sentence_starts.join('、'))}</div>`:''}`;$('chapterRows').innerHTML=s.chapters.map(c=>`<tr><td>${esc(c.chapter)}</td><td>${c.chars}</td><td>${c.avg_score}</td><td>${c.high_ratio}%</td><td>${c.lexical_diversity}</td><td>${c.sentence_mean}</td></tr>`).join('');renderParas();$('results').hidden=false}
function renderParas(){const lvl=$('levelFilter').value,q=$('searchBox').value.toLowerCase();const rows=[...analysis.results].sort((a,b)=>b.score-a.score).filter(r=>(lvl==='all'||r.level===lvl)&&(!q||r.chapter.toLowerCase().includes(q)||r.text.toLowerCase().includes(q)));$('paragraphList').innerHTML=rows.map(r=>`<article class="paragraph"><div class="paragraph-meta"><span class="risk ${r.level}">${r.level} · ${r.score}/100</span><span>#${r.index}</span><span>${esc(r.chapter)}</span><span>${r.chars} 字符</span></div><p>${esc(r.text)}</p><div class="reason"><b>触发特征：</b>${esc(r.reasons)}</div><div class="micro">跨段相似 ${r.cross_similarity} ${r.cross_match_index?'↔ #'+r.cross_match_index:''} · 文风突变 ${r.style_shift} · 词汇多样性 ${r.lexical_diversity} · 平均句长 ${r.sentence_mean} · 功能词密度 ${r.function_density}</div></article>`).join('')||'<p class="empty">无匹配段落</p>'}$('levelFilter').onchange=renderParas;$('searchBox').oninput=renderParas;
function ce(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}$('downloadCsv').onclick=()=>{const h=['段落','章节','原文','字符数','风险分','等级','命中特征','跨段相似','匹配段落','文风突变','词汇多样性','平均句长','功能词密度'];const ls=[h.map(ce).join(',')];analysis.results.forEach(r=>ls.push([r.index,r.chapter,r.text,r.chars,r.score,r.level,r.reasons,r.cross_similarity,r.cross_match_index,r.style_shift,r.lexical_diversity,r.sentence_mean,r.function_density].map(ce).join(',')));const b=new Blob(['\ufeff'+ls.join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='AIGC风险明细-v0.2.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></body></html>
